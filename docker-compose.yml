version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: codecritic-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: codecritic
    ports:
      - "5432:5432"
    volumes:
      - codecritic_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codecritic"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codecritic-api
    environment:
      DATABASE_URL: "postgresql://postgres:password@db:5432/codecritic?schema=public"
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  codecritic_data:
